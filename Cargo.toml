[workspace]
resolver = "2"
members = ["crates/auditforge-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
authors = ["AuditForge contributors"]
repository = "https://github.com/plh-ecosystem/auditforge"

[workspace.dependencies]
auditforge-core = { path = "crates/auditforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
